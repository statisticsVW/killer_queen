; Every movement and timing constant the sim uses. This file is the only source
; of these values: the sim has no built-in defaults, and loading fails if a
; constant is missing or unknown.
;
; Units: distances are milli-pixels in the arcade's 1920x1080 monitor-pixel
; space (1 px = 1000), times are ticks at 50 per second, speeds are
; milli-pixels per tick. Values marked "placeholder" are unmeasured guesses
; until ticket 09; the rest cite docs/research/killer-queen-arcade-reference.md.

[match]

; A Match starts with a countdown: for its first countdown_ticks the Map's
; starting barriers are solid, holding everyone on their Hives' level. The
; length is a placeholder (reference open question 10).
; placeholder: 3 s
countdown_ticks=150

[famine]

; Once the Map's last Berry has been taken (deposited or spent at a Gate),
; Famine lasts countdown_ticks, then every Berry pile refills. 90 s
; (reference section 1.4).
countdown_ticks=4500

[worker]

; 5 px/tick (reference section 3, frame data)
max_speed=5000
; placeholder: instant, pending measurement
run_accel=5000
; placeholder: instant, pending measurement
run_decel=5000
; placeholder collider, 16x20 art pixels
width=32000
height=40000
; placeholder: added to downward speed every tick (0.5 px/tick^2)
gravity=500
; placeholder: terminal fall speed (10 px/tick)
max_fall_speed=10000
; placeholder: upward speed a jump starts with (12.5 px/tick; a held jump
; rises 150 px with the placeholder gravity, enough to reach the next Day level)
jump_speed=12500
; placeholder: releasing the button mid-jump cuts the rise to this speed (a
; one-tick tap rises 45 px)
jump_release_speed=6000
; ticks after leaving the ground that a jump still works (reference section 3)
coyote_ticks=1
; placeholder: jump speed when jumping off an enemy's head (15 px/tick; rises
; 225 px against a ground jump's 150)
springboard_jump_speed=15000
; placeholder: ticks after landing on a head in which a jump springboards
springboard_ticks=5

[ceiling]

; Hitting a ceiling slowly sticks to it; fast, ricochets down (reference
; section 3). Every value here is a placeholder until ticket 09.
; placeholder: ticks a character stays stuck before dropping off (0.5 s)
stick_ticks=25
; placeholder: upward speed above which a hit ricochets instead of sticking
; (6 px/tick); the Speed upgrade raises it
ricochet_threshold=6000
; placeholder: the raised threshold of a Speed Worker or Speed Warrior
; (reference section 3 says Speed raises it, not by how much; 1.35x here)
speed_ricochet_threshold=8100
; placeholder: downward speed a ricochet leaves with (8 px/tick)
ricochet_speed=8000

[bump]

; Enemies who touch without one landing on the other's head Bump: they swap
; horizontal velocities, and neither can steer or turn for a moment
; (reference section 2.5). Both values are placeholders until ticket 09.
; placeholder: speed both are pushed apart at when swapping wouldn't part them
; (2 px/tick)
speed=2000
; placeholder: ticks a Bumped character can't steer or turn (0.2 s)
ticks=10

[winged]

; Queens and Warriors. They Flap instead of jumping: each press adds
; flap_impulse of upward speed, so Flapping faster than once every
; flap_impulse / gravity ticks climbs and slower descends. Every value here is a
; placeholder until ticket 09 unless it cites the reference.
; placeholder collider, 20x24 art pixels; Queen and Warrior share it
; (reference section 2.4)
width=40000
height=48000
; placeholder: added to downward speed every tick (0.5 px/tick^2)
gravity=500
; placeholder: terminal fall speed (10 px/tick)
max_fall_speed=10000
; placeholder: upward speed one Flap adds (3.5 px/tick: hovering takes one Flap
; every 7 ticks, about 7 a second, the bottom of the reference's 7-15)
flap_impulse=3500
; placeholder: fastest rise (8 px/tick, above the ceiling ricochet threshold);
; the Speed upgrade raises it
max_rise_speed=8000
; grounded speed, in ten-thousandths of worker max_speed (0.8412x, reference
; section 3)
walk_speed_ratio=8412
; this many Flaps begun at terminal fall speed stop the fall (reference
; section 3)...
air_brake_flaps=3
; placeholder: ...if the last comes fewer than this many ticks after the first
air_brake_ticks=12

[queen]

; Holding Down in the air Dives: the Queen falls under dive_gravity up to
; dive_max_fall_speed, and her Flaps do nothing. Released, she keeps any speed
; above winged max_fall_speed until she Flaps. Both values are placeholders
; until ticket 09.
; placeholder: 1.5 px/tick^2
dive_gravity=1500
; placeholder: 16 px/tick
dive_max_fall_speed=16000

[respawn]

; A killed character pops, stays dead for ticks, then reappears at its spawn
; point in front of its Team's Hive, blinking: enemy swords can't kill it for
; invulnerable_ticks, counting the tick it reappears on. A Queen instead
; hatches from her next Egg after queen_ticks. All are placeholders until
; ticket 09 (reference open question 1).
; placeholder: 2 s
ticks=100
; placeholder: 1.5 s
invulnerable_ticks=75
; placeholder: a Queen hatches from her next Egg this long after dying (3 s)
queen_ticks=150

[joust]

; When two enemy Queens or Warriors touch, one whose feet are more than
; height_margin above the other's has the higher sword and kills; within it,
; one that runs into the other's back kills; anything else is a Bump
; (reference section 2.5). A Diving Queen needs no margin.
; placeholder: 8 px, until ticket 09 measures Joust geometry
height_margin=8000

[berry]

; Berries in piles sit still. Loose Berries fall under gravity up to
; max_fall_speed, collide with terrain, and slow by friction each tick on the
; ground. A Worker carrying a Berry who runs into a loose one kicks it away at
; kick_speed and up at kick_lift (reference section 3). All placeholders
; until ticket 09, except where noted.
; collider and pile spacing, 7x7 art pixels
size=14000
; placeholder: 0.5 px/tick^2, as Workers
gravity=500
; placeholder: 10 px/tick
max_fall_speed=10000
; placeholder: 0.3 px/tick^2 of sliding speed lost on the ground
friction=300
; placeholder: 6 px/tick
kick_speed=6000
; placeholder: 4 px/tick
kick_lift=4000

[snail]

; A ridden Snail moves toward its rider's Snail Goal; unridden it stays still.
; An enemy Worker walking into its front is eaten: the Snail stops for
; eat_ticks, then the Worker dies (reference section 1.3).
; 0.446 px/tick (reference section 1.3, frame data)
speed=446
; a Speed Worker rider moves it 1.35x as fast, in ten-thousandths (reference
; section 1.3; one source says 1.33x)...
speed_rider_ratio=13500
; 184 ticks, 3.67 s (reference section 1.3, frame data; the community
; glossary says 3 s)...
eat_ticks=184
; ...and a Speed Worker rider eats in half the time (reference section 1.3)
speed_rider_eat_ticks=92
; placeholder collider, 48x26 art pixels
width=96000
height=52000

[speed]

; The Speed upgrade, from a Speed Gate: a Speed Worker's or Speed Warrior's
; max horizontal speed (running, flying and walking) and a Speed Warrior's
; max_rise_speed are this many ten-thousandths of the usual (1.35x, reference
; section 3). Its Snail and ceiling effects are under [snail] and [ceiling].
ratio=13500

[gate]

; A Worker carrying a Berry who stands still at a Gate its Team can use
; transforms: it holds the Berry overhead for hold_ticks, killable and
; Bumpable, then the Berry is spent and the Worker is locked in, untouchable,
; for locked_ticks, then it emerges upgraded and Invulnerable for
; invulnerable_ticks (reference section 2.3).
; placeholder collider, the drawn 28x26 art pixels
width=56000
height=52000
; 1 s (reference section 2.3)
hold_ticks=50
; 1 s (reference section 2.3)
locked_ticks=50
; placeholder: as long as after a Respawn (1.5 s)
invulnerable_ticks=75

[bot]

; Bots: Seats the sim drives itself, through the same stick and button a
; human has.
; Easy Bots' max horizontal speed (running, flying and walking), in
; ten-thousandths of the usual (0.8x, the arcade's Bot speed, reference
; section 3)
easy_speed_ratio=8000
; placeholder: a Bot choosing what to go for next adds up to this many ticks,
; drawn from the Match's random generator, to each choice's travel time, so
; teammates spread out over Berries about as near as each other
choice_jitter_ticks=50
; Bot Difficulty. A Bot sees its enemies as they stood reaction_ticks ago
; (placeholders: Easy 0.36 s, Normal 0.2 s, about a human's, Hard 0.08 s).
; When a Bot Worker chooses what to go for, it picks a reachable target at
; random instead of the best one mistake_percent of the time. When an enemy
; sword first comes close enough to worry about, a Bot notices it
; awareness_percent of the time; one it misses it ignores until it has gone
; out of range again.
easy_reaction_ticks=18
normal_reaction_ticks=10
hard_reaction_ticks=4
easy_mistake_percent=30
normal_mistake_percent=10
hard_mistake_percent=0
easy_awareness_percent=50
normal_awareness_percent=85
hard_awareness_percent=100
