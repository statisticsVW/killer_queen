; Every movement and timing constant the sim uses. This file is the only source
; of these values: the sim has no built-in defaults, and loading fails if a
; constant is missing or unknown.
;
; Units: distances are milli-pixels in the arcade's 1920x1080 monitor-pixel
; space (1 px = 1000), times are ticks at 50 per second, speeds are
; milli-pixels per tick. Values marked "placeholder" are unmeasured guesses
; until ticket 09; the rest cite docs/research/killer-queen-arcade-reference.md.

[worker]

; 5 px/tick (reference section 3, frame data)
max_speed=5000
; placeholder: instant, pending measurement
run_accel=5000
; placeholder: instant, pending measurement
run_decel=5000
; placeholder collider, 16x20 art pixels
width=32000
height=40000
; placeholder: added to downward speed every tick (0.5 px/tick^2)
gravity=500
; placeholder: terminal fall speed (10 px/tick)
max_fall_speed=10000
; placeholder: upward speed a jump starts with (12.5 px/tick; a held jump
; rises 150 px with the placeholder gravity, enough to reach the next Day level)
jump_speed=12500
; placeholder: releasing the button mid-jump cuts the rise to this speed (a
; one-tick tap rises 45 px)
jump_release_speed=6000
; ticks after leaving the ground that a jump still works (reference section 3)
coyote_ticks=1
