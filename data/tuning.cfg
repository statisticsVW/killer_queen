; Every movement and timing constant the sim uses. This file is the only source
; of these values: the sim has no built-in defaults, and loading fails if a
; constant is missing or unknown.
;
; Units: distances are milli-pixels in the arcade's 1920x1080 monitor-pixel
; space (1 px = 1000), times are ticks at 50 per second, speeds are
; milli-pixels per tick. Values marked "measured" were measured frame by frame
; in ticket 09 from the clips listed in docs/research/killer-queen-arcade-reference.md
; section 3.1 ([K] Rise and Fall, [R] On The Ceiling, [J] Sticks (Part 2),
; [L] Rise Rate, [G] Jumping the Gun, [SF] SF League Night 2026-08-24). Values marked
; "estimate" couldn't be measured; "placeholder" ones were outside ticket 09.
; The rest cite the reference.

[match]

; A Match starts with a countdown: for its first countdown_ticks the Map's
; starting barriers are solid, holding everyone on their Hives' level.
; measured: 7.0 s from the "Three paths to victory" card to the gates opening,
; players already moving: 1 s per hex, then 3, 2, 1 at exactly 30 frames each
; [G] 0:41.2-0:48.2 (30 fps, +/-1 frame)
countdown_ticks=350

[famine]

; Once the Map's last Berry has been taken (deposited or spent at a Gate),
; Famine lasts countdown_ticks, then every Berry pile refills. 90 s
; (reference section 1.4).
countdown_ticks=4500

[worker]

; 5 px/tick (reference section 3, frame data)
max_speed=5000
; estimate: instant (a Warrior's track in [R] 5:34 reaches 5 px/tick within
; a tick or two; too noisy to say more)
run_accel=5000
; estimate: instant, as run_accel
run_decel=5000
; placeholder collider, 16x20 art pixels
width=32000
height=40000
; measured: added to downward speed every tick (0.81 px/tick^2): quadratic
; fits about a held jump's apex, [K] 0:16 (0.73-0.84 over six windows), and
; short hops' airtime, [J] 4:00-4:04
gravity=810
; measured: terminal fall speed (8.1 px/tick): linear fit over 54 ticks of a
; fall, [K] 0:16-0:18; Warriors and Queens match it
max_fall_speed=8100
; measured: upward speed a jump starts with (15.5 px/tick): a held jump's feet
; rise 141 px, [K] 0:16, which this gives. Enough to reach the next Day level.
; The arcade's rise builds over its first ~5 ticks rather than starting at
; full speed; only the height and gravity are matched.
jump_speed=15500
; measured: releasing the button mid-jump cuts the rise to this speed. Short
; hops rise 45-51 px over 18-22 ticks, [J] 4:00-4:04; a two-tick tap here
; rises 50 px over 21 ticks (a one-tick tap 37 px)
jump_release_speed=6500
; ticks after leaving the ground that a jump still works (reference section 3)
coyote_ticks=1
; estimate: jump speed when jumping off an enemy's head, 1.2x jump_speed as
; before (rises 204 px against a ground jump's 141)
springboard_jump_speed=18600
; placeholder: ticks after landing on a head in which a jump springboards
springboard_ticks=5

[ceiling]

; Hitting a ceiling slowly sticks to it; fast, ricochets down (reference
; section 3).
; measured: ticks a character stays stuck before dropping off: a vanilla
; Warrior's best stick lasts 24 frames at 60 fps, [J] 3:01 (counted by its
; author; a Speed Warrior's best lasts 32)
stick_ticks=20
; estimate: upward speed above which a hit ricochets instead of sticking
; (8 px/tick): between a three-Flap stick's rise and full max_rise_speed, which
; bounces, [R] 1:20-2:40; the Speed upgrade raises it
ricochet_threshold=8000
; estimate: the raised threshold of a Speed Worker or Speed Warrior, 1.35x
; ([J] 2:00-3:30: Speed's best stick rises 35% higher and lasts 35% longer)
speed_ricochet_threshold=10800
; estimate: downward speed a ricochet leaves with (8 px/tick, terminal): a
; Queen leaving the ceiling falls at about terminal speed at once, [K] 1:47
ricochet_speed=8000

[bump]

; Enemies who touch without one landing on the other's head Bump: they swap
; horizontal velocities, and neither can steer or turn for a moment
; (reference section 2.5). Neither value could be measured: Bumps in [SF]
; are too tangled with other players to track at 80% scale.
; estimate: speed both are pushed apart at when swapping wouldn't part them
; (2 px/tick)
speed=2000
; estimate: ticks a Bumped character can't steer or turn (0.2 s; "brief",
; reference section 2.5)
ticks=10

[winged]

; Queens and Warriors. They Flap instead of jumping: each press adds
; flap_impulse of upward speed, so Flapping faster than once every
; flap_impulse / gravity ticks climbs and slower descends.
; placeholder collider, 20x24 art pixels; Queen and Warrior share it
; (reference section 2.4)
width=40000
height=48000
; measured: added to downward speed every tick (0.53 px/tick^2, lighter than
; a Worker's): quadratic fits about the apex of a Warrior's free arc after
; three Flaps, [R] 5:34-5:37 (0.51-0.64 over five windows)
gravity=530
; measured: terminal fall speed (8.1 px/tick): a Queen falling, [K] 1:05
; (8.2) and [K] 1:47 (8.0), the same as a Worker
max_fall_speed=8100
; estimate: upward speed one Flap adds (4.3 px/tick). Footage alone suggests
; 6: Queens tapping 4 times a second can't climb, 5 barely, 6 and up rise,
; [L] 0:26-1:00 (tap robot). But at 6 two Flaps stop a terminal fall, and the
; air brake takes three (reference section 3), so the largest Flap that keeps
; that is used: climbing takes a Flap at least every 8 ticks, 6.2 a second,
; within players' 7-15 (reference section 3). The arcade's climb rate doesn't
; depend on the tap rate from 6 a second up; here it does.
flap_impulse=4300
; measured: fastest rise (9 px/tick): a tap-robot Warrior climbs a steady
; 6.02 video px/tick at 720p over 100 ticks, [K] 1:44; the Speed upgrade raises
; it 35% ([J] 1:30)
max_rise_speed=9000
; grounded speed, in ten-thousandths of worker max_speed (0.8412x, reference
; section 3)
walk_speed_ratio=8412
; this many Flaps begun at terminal fall speed stop the fall (reference
; section 3)...
air_brake_flaps=3
; estimate: ...if the last comes fewer than this many ticks after the first
; (three taps within 0.24 s; no footage isolates an air brake)
air_brake_ticks=12

[queen]

; Holding Down in the air Dives: the Queen falls under dive_gravity up to
; dive_max_fall_speed, and her Flaps do nothing. Released, she keeps any speed
; above winged max_fall_speed until she Flaps.
; measured: 1.2 px/tick^2: quadratic fits of two Dives' first 10 ticks, [K]
; 1:05 (1.20 and 1.28)
dive_gravity=1200
; measured: 16.2 px/tick, twice a fall's terminal speed: linear fit over 52
; ticks of a Dive, [K] 1:05 (16.24); its author calls it exactly twice
dive_max_fall_speed=16200

[respawn]

; A killed character pops, stays dead for ticks, then reappears at its spawn
; point in front of its Team's Hive, blinking: enemy swords can't kill it for
; invulnerable_ticks, counting the tick it reappears on. A Queen instead
; hatches from her next Egg after queen_ticks.
; measured: 2.77 s from a Worker's death pop to its coloured Worker standing
; at the Hive (a white outline grows there first, from 0.9 s); two Gold
; Workers both took exactly 2.767 s, [SF] 5:28.7 and 5:29.5 (60 fps)
ticks=138
; estimate: 1.5 s, as before; no blinking showed at 15 fps in [SF] 5:32
invulnerable_ticks=75
; measured: a Queen hatches from her next Egg this long after dying (2.4 s):
; 2.45 s and 2.41 s from her death to her stepping out of the cracked Egg,
; [SF] 6:06.6 and 6:29.4
queen_ticks=120

[joust]

; When two enemy Queens or Warriors touch, one whose feet are more than
; height_margin above the other's has the higher sword and kills; within it,
; one that runs into the other's back kills; anything else is a Bump
; (reference section 2.5). A Diving Queen needs no margin.
; placeholder: 8 px, until ticket 09 measures Joust geometry
height_margin=8000

[berry]

; Berries in piles sit still. Loose Berries fall under gravity up to
; max_fall_speed, collide with terrain, and slow by friction each tick on the
; ground. A Worker carrying a Berry who runs into a loose one kicks it away at
; kick_speed and up at kick_lift (reference section 3). All placeholders
; until ticket 09, except where noted.
; collider and pile spacing, 7x7 art pixels
size=14000
; placeholder: 0.5 px/tick^2, as Workers
gravity=500
; placeholder: 10 px/tick
max_fall_speed=10000
; placeholder: 0.3 px/tick^2 of sliding speed lost on the ground
friction=300
; placeholder: 6 px/tick
kick_speed=6000
; placeholder: 4 px/tick
kick_lift=4000

[snail]

; A ridden Snail moves toward its rider's Snail Goal; unridden it stays still.
; An enemy Worker walking into its front is eaten: the Snail stops for
; eat_ticks, then the Worker dies (reference section 1.3).
; 0.446 px/tick (reference section 1.3, frame data)
speed=446
; a Speed Worker rider moves it 1.35x as fast, in ten-thousandths (reference
; section 1.3; one source says 1.33x)...
speed_rider_ratio=13500
; 184 ticks, 3.67 s (reference section 1.3, frame data; the community
; glossary says 3 s)...
eat_ticks=184
; ...and a Speed Worker rider eats in half the time (reference section 1.3)
speed_rider_eat_ticks=92
; placeholder collider, 48x26 art pixels
width=96000
height=52000

[speed]

; The Speed upgrade, from a Speed Gate: a Speed Worker's or Speed Warrior's
; max horizontal speed (running, flying and walking) and a Speed Warrior's
; max_rise_speed are this many ten-thousandths of the usual (1.35x, reference
; section 3). Its Snail and ceiling effects are under [snail] and [ceiling].
ratio=13500

[gate]

; A Worker carrying a Berry who stands still at a Gate its Team can use
; transforms: it holds the Berry overhead for hold_ticks, killable and
; Bumpable, then the Berry is spent and the Worker is locked in, untouchable,
; for locked_ticks, then it emerges upgraded and Invulnerable for
; invulnerable_ticks (reference section 2.3).
; placeholder collider, the drawn 28x26 art pixels
width=56000
height=52000
; 1 s (reference section 2.3)
hold_ticks=50
; 1 s (reference section 2.3)
locked_ticks=50
; placeholder: as long as after a Respawn (1.5 s)
invulnerable_ticks=75

[bot]

; Bots: Seats the sim drives itself, through the same stick and button a
; human has.
; Easy Bots' max horizontal speed (running, flying and walking), in
; ten-thousandths of the usual (0.8x, the arcade's Bot speed, reference
; section 3)
easy_speed_ratio=8000
; placeholder: a Bot choosing what to go for next adds up to this many ticks,
; drawn from the Match's random generator, to each choice's travel time, so
; teammates spread out over Berries about as near as each other
choice_jitter_ticks=50
; Bot Difficulty. A Bot sees its enemies as they stood reaction_ticks ago
; (placeholders: Easy 0.36 s, Normal 0.2 s, about a human's, Hard 0.08 s).
; When a Bot Worker chooses what to go for, it picks a reachable target at
; random instead of the best one mistake_percent of the time. When an enemy
; sword first comes close enough to worry about, a Bot notices it
; awareness_percent of the time; one it misses it ignores until it has gone
; out of range again.
easy_reaction_ticks=18
normal_reaction_ticks=10
hard_reaction_ticks=4
easy_mistake_percent=30
normal_mistake_percent=10
hard_mistake_percent=0
easy_awareness_percent=50
normal_awareness_percent=85
hard_awareness_percent=100
