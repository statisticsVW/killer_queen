[barriers]

; The starting barriers: rope floors across the four gaps in the Hives' level,
; solid only during the countdown at the start of a Match, so nobody can drop
; below that level before play begins. Each is a rectangle of whole tiles,
; Rect2i(left, top, width, height). Measured off Day-Start.png (reference
; section 4.3), where the ropes span x 118-335, 480-697, 1223-1440 and
; 1585-1802 at y 220-235.
rects=[Rect2i(120, 216, 216, 24), Rect2i(480, 216, 216, 24), Rect2i(1224, 216, 216, 24), Rect2i(1584, 216, 216, 24)]

