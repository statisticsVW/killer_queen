; The Day Map. Positions are whole pixels in the arcade's 1920x1080 space, y
; down; the loader converts them to milli-pixels. Each object position is the
; bottom-centre of the object, standing on the surface below it.
;
; Layout measured off the start-state image linked in
; docs/research/killer-queen-arcade-reference.md section 4.3 (Day-Start.png,
; 1920x1080) on a 12 px grid. The centre platforms (y 576 and 816) are exactly
; their measured 900-1020 px; other platform ends are within 6 px of the image.
; Positions of objects are placeholders until the tickets that use them.

[map]

name="Day"
; Pixels per collision tile. Must divide 1920 and 1080.
tile_size=12
; One string per tile row, top to bottom. The first character says what both
; side edges do on that row: '|' blocks, '~' wraps to the other side for
; everyone, 'w' wraps for Workers only (winged units are blocked). Then one
; character per tile: '#' solid, '.' empty.
; Day wraps only below the top walls (rows 40 and down, y >= 480).
